<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - RBLX Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page" data-dashboard>
        <header class="topbar">
            <a class="brand" href="/dashboard">
                <span>RBLX Clone</span>
            </a>
            <nav class="nav" aria-label="Primary">
                <a href="/profile">Profile</a>
                <a href="/dashboard#search">Search</a>
                <a href="/avatar">Avatar</a>
                <button class="button danger" type="button" data-logout>Logout</button>
            </nav>
        </header>

        <main id="main">
            <div class="dashboard-head">
                <div>
                    <p class="label">Dashboard</p>
                    <h1 class="page-title" data-welcome-heading>Welcome</h1>
                </div>
            </div>

            <div class="status" data-dashboard-status aria-live="polite"></div>

            <section class="dashboard-grid social-dashboard">
                <article class="panel profile-overview">
                    <p class="label">Profile</p>
                    <div data-profile-summary></div>
                </article>

                <article class="panel social-tabs-panel">
                    <div class="dashboard-tabs" role="tablist" aria-label="Dashboard sections">
                        <button class="dashboard-tab active" type="button" role="tab" aria-selected="true" data-dashboard-tab="friends">
                            Friends <span data-friends-count>0</span>
                        </button>
                        <button class="dashboard-tab" type="button" role="tab" aria-selected="false" data-dashboard-tab="requests">
                            Requests <span data-requests-count>0</span>
                        </button>
                        <button class="dashboard-tab" type="button" role="tab" aria-selected="false" data-dashboard-tab="search">
                            Search
                        </button>
                    </div>

                    <section class="dashboard-panel active" role="tabpanel" data-dashboard-panel="friends">
                        <div class="panel-heading">
                            <div>
                                <p class="label">Friends</p>
                                <h2>Your friends</h2>
                            </div>
                        </div>
                        <div class="user-grid" data-friends-list></div>
                    </section>

                    <section class="dashboard-panel" role="tabpanel" hidden data-dashboard-panel="requests">
                        <div class="panel-heading">
                            <div>
                                <p class="label">Requests</p>
                                <h2>Friend requests</h2>
                            </div>
                        </div>
                        <h3>Incoming</h3>
                        <div class="stack-list" data-incoming-requests></div>
                        <h3>Sent</h3>
                        <div class="stack-list" data-outgoing-requests></div>
                    </section>

                    <section class="dashboard-panel" role="tabpanel" hidden data-dashboard-panel="search">
                        <div class="panel-heading">
                            <div>
                                <p class="label">People</p>
                                <h2>Search players</h2>
                            </div>
                        </div>
                        <form class="dashboard-search" data-dashboard-search-form>
                            <label class="field" for="dashboard-people-search">
                                <span>Username or user ID</span>
                                <input class="input" id="dashboard-people-search" name="q" type="search" autocomplete="off" data-dashboard-search-input>
                            </label>
                            <button class="button" type="submit">Search people</button>
                        </form>
                        <div class="status" data-dashboard-search-status aria-live="polite"></div>
                        <div class="user-grid" data-dashboard-search-results></div>
                    </section>
                </article>
            </section>
        </main>
    </div>
    <script src="/app.js?v=social-2" defer></script>
</body>
</html>
