<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar - RBLX Clone</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page" data-avatar>
        <header class="topbar">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true"></span>
                <span>RBLX Clone</span>
            </a>
            <nav class="nav" aria-label="Primary">
                <a href="/dashboard">Dashboard</a>
                <a href="/">Home</a>
            </nav>
        </header>

        <main id="main">
            <div class="dashboard-head">
                <div>
                    <p class="label">Avatar</p>
                    <h1 class="page-title">Colors</h1>
                </div>
                <button class="button" type="button" data-save-avatar>Save avatar</button>
            </div>

            <section class="avatar-layout">
                <div class="panel">
                    <h2>Preview</h2>
                    <div class="avatar-stage">
                        <div class="avatar-figure" data-avatar-figure aria-label="Avatar preview"></div>
                    </div>
                </div>

                <div class="panel">
                    <h2>Body part</h2>
                    <div class="part-tabs" data-part-tabs></div>

                    <div class="range-grid">
                        <div class="color-preview" data-color-preview></div>
                        <label class="range-row">
                            <span>Red</span>
                            <input type="range" min="0" max="255" value="128" data-slider="red">
                            <strong data-value="red">128</strong>
                        </label>
                        <label class="range-row">
                            <span>Green</span>
                            <input type="range" min="0" max="255" value="128" data-slider="green">
                            <strong data-value="green">128</strong>
                        </label>
                        <label class="range-row">
                            <span>Blue</span>
                            <input type="range" min="0" max="255" value="128" data-slider="blue">
                            <strong data-value="blue">128</strong>
                        </label>
                    </div>

                    <div class="status" data-status aria-live="polite"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="/app.js" defer></script>
</body>
</html>
